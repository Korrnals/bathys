<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="315" viewBox="0 0 1200 315" role="img" aria-label="Bathys — unified local deep-research search service for AI agents">
  <defs>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="0.55" stop-color="#0d2137"/>
      <stop offset="1" stop-color="#071020"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.0"/>
      <stop offset="0.35" stop-color="#5eead4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0.0"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef9c3" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fef9c3" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="315" rx="0"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="315" fill="url(#deep)"/>
    <!-- light rays -->
    <g opacity="0.16">
      <polygon points="0,0 140,315 30,315" fill="#38bdf8"/>
      <polygon points="150,0 320,315 230,315" fill="#38bdf8"/>
      <polygon points="1060,0 1200,120 1200,240" fill="#38bdf8"/>
    </g>
    <!-- sonar beam -->
    <polygon points="215,66 118,300 330,300" fill="url(#beam)"/>
    <!-- depth bubbles -->
    <g fill="#7dd3fc" opacity="0.35">
      <circle cx="520" cy="70" r="3"/><circle cx="540" cy="120" r="2"/>
      <circle cx="640" cy="60" r="2.5"/><circle cx="880" cy="90" r="3"/>
      <circle cx="905" cy="150" r="2"/><circle cx="1120" cy="70" r="2.5"/>
      <circle cx="500" cy="220" r="2.5"/><circle cx="1090" cy="200" r="2"/>
    </g>
    <!-- bathyscaphe: float + hull + light -->
    <g>
      <ellipse cx="245" cy="120" rx="58" ry="26" fill="#e2e8f0"/>
      <rect x="240" y="128" width="10" height="18" fill="#94a3b8"/>
      <path d="M172 168 q73 -46 146 0 l-24 84 q-49 22 -98 0 z" fill="#cbd5e1"/>
      <path d="M172 168 q73 -46 146 0 l-24 84 q-49 22 -98 0 z" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <rect x="216" y="176" width="58" height="40" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
      <path d="M204 252 q41 16 82 0" stroke="#64748b" stroke-width="3" fill="none"/>
      <!-- lamp glow -->
      <circle cx="245" cy="258" r="46" fill="url(#lamp)"/>
      <circle cx="245" cy="258" r="7" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
      <!-- artifacts on the seabed, lit by the lamp -->
      <g fill="#94a3b8"><rect x="180" y="278" width="16" height="12" rx="2" transform="rotate(-8 188 284)"/><rect x="284" y="282" width="12" height="9" rx="2" transform="rotate(10 290 286)"/></g>
      <circle cx="310" cy="272" r="5" fill="#7dd3fc" opacity="0.8"/>
    </g>
    <!-- wordmark -->
    <text x="380" y="150" font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="86" font-weight="700" fill="#f1f5f9" letter-spacing="2">Bathys</text>
    <text x="384" y="196" font-family="'Segoe UI',Inter,system-ui,sans-serif" font-size="26" font-weight="500" fill="#5eead4">Unified local deep-research search service for AI agents</text>
    <text x="384" y="232" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="17" fill="#94a3b8">metasearch → extraction → query distillation → cache · zero cloud quotas</text>
    <!-- footer strip: four tools -->
    <g font-family="ui-monospace,Consolas,monospace" font-size="15" fill="#64748b">
      <rect x="0" y="283" width="1200" height="32" fill="#04101e" opacity="0.85"/>
      <text x="380" y="304">deep_research</text><text x="520" y="304">web_search</text><text x="640" y="304">read_url</text><text x="760" y="304" fill="#5eead4">read_urls</text>
      <text x="862" y="304" fill="#38bdf8">MCP · stdio</text>
    </g>
  </g>
</svg>
