[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bathys"
version = "0.6.1"
description = "Deep-research MCP server: SearXNG metasearch + Crawl4AI extraction, distilled to LLM-lean output"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
    "crawl4ai>=0.6.0",
]

[project.scripts]
bathys = "bathys.server:main"
bathys-doctor = "bathys.doctor:main"
bathys-install = "bathys.installer:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bathys"]

# Ship the agent profile + drop-in with the wheel so `bathys install
# --with-agent` works from a PyPI install, not only from a repo clone.
[tool.hatch.build.targets.wheel.force-include]
"agents" = "bathys/agents"
